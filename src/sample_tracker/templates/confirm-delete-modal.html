<!-- Confirm Delete Modal -->
<div class="modal fade" id="confirmDelete" tabindex="-1" role="dialog" aria-labelledby="confirmDelete" aria-hidden="true">
	<div class="modal-dialog modal-dialog-centered" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="confirmDeleteTitle">Are you sure?</h5>
			</div>
			<div class="modal-body" id="confirmDeleteMessage">
				Filler
			</div>
			<div class="text-center" id="object-name"></div>
			<div class="text-center">(ID: <em id="object-id"></em>)</div>
			<div class="modal-footer">
				<button id="cancelDeleteButton" class="btn btn-primary" data-bs-dismiss="modal">Cancel</button>
				<span></span>
				<a id="confirmDeleteButton" href="example.com" class="button btn btn-danger">
					Delete
				</a>
			</div>
		</div>
	</div>
</div>
