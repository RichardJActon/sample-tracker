  sample-tracker:
    image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
    # build: .
    container_name: sample-tracker
    working_dir: /app
    # entrypoint: []
    # The container's default entrypoint is ["uv"] so this needs to be
    # overridden to to run the the full uv sync / run commands
    entrypoint: /bin/sh
    command:
      - -c
      - |
        ### move to image build?
        apt-get update && apt-get install -y --no-install-recommends npm
        pushd src/sample_tracker/static
        npm ci
        popd
        ###
        uv sync --locked --all-extras --dev
        # uv run flask --app src/sample_tracker run --host=0.0.0.0
        uv run flask --debug --app src/sample_tracker run --host=0.0.0.0
    volumes:
      - ./:/app
      - /app/.venv # do not mount .venv
      
    environment:
      APP_MONGO__PWD: ${APP_MONGO__PWD}
      APP_MONGO__DATABASE: ${APP_MONGO__DATABASE}
      APP_MONGO__USER: ${APP_MONGO__USER}
      APP_MONGO__AUTH_SOURCE: ${APP_MONGO__AUTH_SOURCE}
      APP_OAUTH_ENDPOINTS__testing__client_secret: ${APP_OAUTH_ENDPOINTS__testing__client_secret}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      
      # overriding the default values here to use the docker default network
      APP_OAUTH_ENDPOINTS__testing__server_metadata_url: http://keycloak:8081/realms/app-dev/.well-known/openid-configuration
      APP_OAUTH_ENDPOINTS__testing__revocation: http://keycloak:8081/realms/app-dev/protocol/openid-connect/revoke
      # APP_MONGO__HOST: ${APP_MONGO__HOST}
      APP_MONGO__HOST: mongodb
      # APP_MONGO__PORT: ${APP_MONGO__PORT}
      APP_MONGO__PORT: 27017 # accessing via the docker default network
    ports:
      - "127.0.0.1:5080:5000"

